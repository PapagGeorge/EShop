services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eshop-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStr0ng!Pass
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStr0ng!Pass" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - eshop-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - eshop-network

  seq:
    image: datalust/seq:latest
    container_name: eshop-seq
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - eshop-network

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/EShop.Identity.API/Dockerfile
    container_name: eshop-identity-api
    ports:
      - "5213:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - eshop-network

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/EShop.Ordering.API/Dockerfile
    container_name: eshop-ordering-api
    ports:
      - "5281:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      catalog-api:
        condition: service_started
    networks:
      - eshop-network

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/EShop.Catalog.API/Dockerfile
    container_name: eshop-catalog-api
    ports:
      - "5056:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - seq
    networks:
      - eshop-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/EShop.ApiGateway/Dockerfile
    container_name: eshop-api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - identity-api
      - ordering-api
      - catalog-api
      - seq
    networks:
      - eshop-network

  web:
    build:
      context: src/Web/EShop.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: eshop-web
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - eshop-network

volumes:
  sqlserver-data:

networks:
  eshop-network:
    driver: bridge
