name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  DOCKER_HUB_USERNAME: geopapag
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: identity-api
            dockerfile: src/Services/Identity/EShop.Identity.API/Dockerfile
            context: .
            build_args: ""
          - name: ordering-api
            dockerfile: src/Services/Ordering/EShop.Ordering.API/Dockerfile
            context: .
            build_args: ""
          - name: catalog-api
            dockerfile: src/Services/Catalog/EShop.Catalog.API/Dockerfile
            context: .
            build_args: ""
          - name: api-gateway
            dockerfile: src/ApiGateway/EShop.ApiGateway/Dockerfile
            context: .
            build_args: ""
          - name: web
            dockerfile: src/Web/EShop.Web/Dockerfile
            context: src/Web/EShop.Web
            build_args: "VITE_API_BASE_URL=http://localhost:5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/eshop-${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build_args }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  update-manifests:
    name: Update K8s Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Update image tags in K8s manifests
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for SERVICE in identity-api ordering-api catalog-api api-gateway web; do
            FILE="k8s/services/${SERVICE}.yaml"
            sed -i "s|image: geopapag/eshop-${SERVICE}:.*|image: geopapag/eshop-${SERVICE}:${TAG}|g" "$FILE"
            echo "Updated ${FILE} → :${TAG}"
          done

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/services/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(k8s): update image tags to ${{ steps.tag.outputs.tag }} [skip ci]"
            git push
          fi
