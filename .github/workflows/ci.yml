name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore EShop.sln

      - name: Build
        run: dotnet build EShop.sln --no-restore --configuration Release

      - name: Run unit tests — Identity
        run: >
          dotnet test tests/EShop.Identity.UnitTests
          --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=identity-results.trx"

      - name: Run unit tests — Ordering
        run: >
          dotnet test tests/EShop.Ordering.UnitTests
          --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=ordering-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  build-web:
    name: Build Web (TypeScript check)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Web/EShop.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/Web/EShop.Web
        run: npm ci

      - name: Build
        working-directory: src/Web/EShop.Web
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
