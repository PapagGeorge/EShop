## Development overrides
## Usage: docker-compose -f docker-compose.yml -f docker-compose.override.yml up
services:

  sqlserver:
    environment:
      - MSSQL_PID=Developer

  rabbitmq:
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  seq:
    volumes:
      - seq-data:/data

  identity-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

  ordering-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

  catalog-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

  api-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

volumes:
  rabbitmq-data:
  seq-data:
