apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: geopapag/eshop-api-gateway:sha-5ef0ee2
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Docker"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
---
# LoadBalancer: προσβάσιμο από τον browser στο localhost:5000
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eshop
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 5000
    targetPort: 8080
