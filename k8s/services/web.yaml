apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: geopapag/eshop-web:1.0.0
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eshop
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - port: 3000
    targetPort: 80
